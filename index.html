<style>
:root{--bg:#F3FAF7;--card:#FFFFFF;--ink:#10302C;--mute:#4E6B67;--teal:#0E5A52;--teal2:#0A423C;--spark:#F4B63F;--line:#D6E8E2;--sh:0 8px 24px rgba(14,90,82,.14);box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0B1F1D;--card:#12302C;--ink:#E8F5F1;--mute:#9DBDB6;--teal:#1C8A7C;--teal2:#136B60;--line:#1E4742;--sh:0 8px 24px rgba(0,0,0,.35)}}
*{box-sizing:border-box;margin:0}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{background:var(--bg);color:var(--ink);font-family:Tajawal,"Segoe UI",Tahoma,sans-serif;line-height:1.7;overflow-x:hidden}
button,a{font:inherit;color:inherit;text-decoration:none}
button{cursor:pointer;border:0;background:none}
:focus-visible{outline:3px solid var(--spark);outline-offset:2px}
.wrap{max-width:560px;margin:auto;padding:0 18px}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(10px)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:21}
.bar{display:flex;align-items:center;justify-content:space-between;padding:12px 0}
.btn{background:var(--teal);color:#fff;border-radius:16px;padding:10px 20px;font-weight:700;box-shadow:var(--sh);transition:transform .2s,background .2s;display:inline-flex;align-items:center;gap:8px}
.btn:hover{background:var(--teal2);transform:translateY(-2px)}
.btn.big{padding:16px 34px;font-size:1.15rem;border-radius:20px}
.logo{display:flex;align-items:center;gap:6px;font-weight:800;font-size:1.5rem;color:var(--teal)}
.burger{width:46px;height:46px;border-radius:14px;background:var(--card);box-shadow:var(--sh);font-size:1.4rem}
#menu{position:fixed;inset:0;z-index:40;background:rgba(5,25,22,.5);display:none}
#menu.on{display:block}
#menu .panel{position:absolute;top:0;bottom:0;left:0;width:78%;max-width:340px;background:var(--bg);padding:24px;display:flex;flex-direction:column;gap:12px;box-shadow:var(--sh)}
#menu .panel a{background:var(--card);border-radius:16px;padding:16px;font-weight:700;box-shadow:var(--sh);text-align:center}
#menu .x{align-self:flex-start;width:42px;height:42px;border-radius:50%;background:var(--teal);color:#fff;font-size:1.2rem}
section{padding:26px 0}
.hero{text-align:center;padding-top:34px;position:relative}
.hero h1{font-size:3.2rem;font-weight:800;color:var(--teal);line-height:1.2}
.spark{width:150px;height:150px;margin:0 auto 6px;position:relative}
.spark i{position:absolute;inset:0;border-radius:50%;background:radial-gradient(circle,var(--spark) 0,rgba(244,182,63,.25) 45%,transparent 70%);filter:blur(2px)}
.spark svg{position:absolute;inset:30px;width:90px;height:90px}
.hero .s1{font-size:1.5rem;font-weight:700;margin:6px 0}
.hero .s2{color:var(--mute);margin-bottom:22px}
.ad{background:linear-gradient(135deg,var(--teal),var(--teal2));color:#fff;border-radius:24px;padding:22px;display:flex;align-items:center;gap:14px;box-shadow:var(--sh)}
.ad svg{flex:none;width:92px}
.ad b{display:block;margin-bottom:10px;font-size:1.1rem}
.ad .btn{background:var(--spark);color:#2a2000;padding:7px 16px;font-size:.9rem}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.stat{background:var(--card);border-radius:24px;padding:20px 10px;text-align:center;box-shadow:var(--sh)}
.stat svg{width:44px;height:44px;color:var(--teal)}
.stat p{color:var(--mute);font-size:.9rem}
.stat strong{display:block;font-size:2rem;color:var(--teal);font-weight:800}
h2{font-size:1.5rem;color:var(--teal);margin-bottom:14px;text-align:center}
.why{background:var(--card);border-radius:24px;padding:20px;box-shadow:var(--sh);text-align:center}
.pillars{position:relative;margin-top:0;padding:18px 28px 0 0}
.pillars{--l:1}
.pillars::before{content:"";position:absolute;right:10px;top:0;bottom:30px;width:3px;background:linear-gradient(var(--teal),var(--spark));border-radius:3px;transform:scaleY(var(--l));transform-origin:top}
.pil{position:relative;background:var(--card);border-radius:20px;padding:16px;box-shadow:var(--sh);margin-bottom:16px}

article:k=>{const a=ARTS[k];return `<a class="btn back" href="#articles">العودة ›</a><h1 class="page-t">${a.t}</h1><img class="cover" src="${a.img}" alt=""><div class="body">${md(a.b)}${a.cta?`<a class="btn big" href="${safe(CFG.wa)}" target="_blank" rel="noopener" style="margin-top:16px">قناة ونار ›</a>`:''}</div>`},
about:()=>`<h1 class="page-t">من نحن</h1><div class="body"><p>وَنَار منصة تعليمية مجانية لطلاب الصفوف 9 إلى 12، فكرتها بسيطة: كل ما يحتاجه الطالب للدراسة في مكان واحد.</p><h3>رسالتنا</h3><p>نجمع أجود الملفات والمذكرات، ونقدم استراتيجيات مذاكرة تختصر الوقت والجهد، ونبني مجتمعاً طلابياً يتبادل المعرفة والتحفيز.</p><h3>شعارنا</h3><p>نتعب اليوم لنضيء غداً.</p><h3>تنبيه</h3><p>المنصة مجانية بالكامل ولا يحق لأحد استخدامها لأغراض تجارية.</p></div>`,
subjects:(g,t)=>{const F=FL(g,t);const grp=(n,a)=>a.length?`<h2 class="grp" style="text-align:right">${n}</h2><div class="subj">${a.join('')}</div>`:'';
 const top=`<a class="btn back" href="#grades">العودة ›</a><h1 class="page-t">الصف ${g} - الترم ${t==1?'الأول':'الثاني'}</h1>`+(isD(g,t)?`<a class="big-link" href="${DRIVE}" target="_blank" rel="noopener">كل ملفات هذا الفصل على درايف ☁️</a>`:'');
 if(+g<=10)return top+SG910.map(([n,a])=>grp(n,a.map(s=>F&&F[s]?`<a href="#sub-${g}-${t}-${SUBJ.indexOf(s)}">${dn(g,s)}</a>`:`<button data-t="ملفات ${dn(g,s)} ستتوفر قريباً">${dn(g,s)}</button>`))).join('');
 if(!F)return top+GN.slice(0,4).map((n,k)=>grp(n,(k==0?G.shared:k==1?G.sci:k==2?G.lit:G.solo).map(s=>`<button data-t="ملفات ${s} ستتوفر قريباً">${s}</button>`))).join('');
 return top+GN.map((n,k)=>grp(n,SG.map((x,i)=>[x[0],x[1],i]).filter(x=>x[1]==k&&(F[x[0]]||(k<4&&!x[0].startsWith('الرياضيات')))).map(x=>F[x[0]]?`<a href="#sub-${g}-${t}-${x[2]}">${x[0]}</a>`:`<button data-t="ملفات ${x[0]} ستتوفر قريباً">${x[0]}</button>`))).join('')},
subject:(g,t,i,c)=>{const F=(FL(g,t)||{})[SUBJ[i]]||[],T=`الصف ${g} - الترم ${t==1?'الأول':'الثاني'}`,S=secsOf(F);
 const fr=f=>`<div class="file"><div class="fn">${esc(f[0].replace(/^(اختبارات|ملخصات|الكتب) › /,''))}</div><div class="fa"><button class="btn" data-id="${f[1]}" data-ty="${f[2]}" data-nm="${esc(dn(g,SUBJ[i])+' - '+f[0])}">فتح هنا</button><a class="btn ghost" href="${ext(f[1],f[2])}" target="_blank" rel="noopener">معاينة خارجية</a></div></div>`;
 if(!c)return `<a class="btn back" href="#s-${g}-${t}">العودة ›</a><h1 class="page-t">${dn(g,SUBJ[i])}</h1><p class="mute" style="margin-bottom:14px">${T}</p>`+(S.length?S.map(x=>`<a class="big-link" href="#sub-${g}-${t}-${i}-${x.c}"><span>${x.i} ${esc(x.t)}</span><span class="cnt">${x.f.length}</span></a>`).join(''):'<div class="body"><p>لا توجد ملفات لهذه المادة بعد.</p></div>');
 const C=S.find(x=>x.c==c);let body='';
 if(C&&c=='ex'){const m={};C.f.forEach(f=>(m[st(f[0])]=m[st(f[0])]||[]).push(f));const ord=['الأسئلة العامة','الاختبارات القصيرة','الاختبارات النهائية'];
  body=Object.keys(m).sort((a,b)=>(ord.indexOf(a)+1||9)-(ord.indexOf(b)+1||9)).map(k=>`<div class="grade"><button class="row">${esc(k)}<span><span class="cnt">${m[k].length}</span> <span class="ar">‹</span></span></button><div class="sub">${m[k].map(fr).join('')}</div></div>`).join('')}
 else if(C)body=C.f.map(fr).join('');else body='<div class="body"><p>هذا القسم فارغ.</p></div>';
 return `<a class="btn back" href="#sub-${g}-${t}-${i}">العودة ›</a><h1 class="page-t">${esc(C?C.t:'')} - ${dn(g,SUBJ[i])}</h1><p class="mute" style="margin-bottom:14px">${T}</p>`+body},
book:()=>`<a class="btn back" href="#home">العودة ›</a><h1 class="page-t">احجز إعلانك</h1><p class="mute" style="margin-bottom:14px">اختر وسيلة التواصل المناسبة لك:</p><a class="big-link" href="${safe(CFG.wa)}" target="_blank" rel="noopener">قناة الواتساب${ico.wa}</a><a class="big-link" href="${safe(CFG.ig)}" target="_blank" rel="noopener">حساب الانستقرام${ico.ig}</a><a class="big-link" href="${wam(CFG.phone)}" target="_blank" rel="noopener"><span>مراسلة مدير ونار واتساب<br><small dir="ltr">${esc(CFG.phone)}</small></span>${ico.wa}</a>`,
admin:()=>`<h1 class="page-t">لوحة التحكم</h1><div id="adm"></div>`,
discuss:()=>`<h1 class="page-t">مجموعة النقاش</h1><p class="mute">اختر صفك وشارك في أسئلة النقاش.</p><div class="chips">${[9,10,11,12].map(g=>`<button class="chip${g==DGR?' on':''}" data-g="${g}">الصف ${g}</button>`).join('')}</div><div id="dq"></div>`,

contact:()=>`<h1 class="page-t">تواصل معنا</h1><a class="big-link" href="${safe(CFG.wa)}" target="_blank" rel="noopener">قناة الفريق في الواتساب${ico.wa}</a><a class="big-link" href="${safe(CFG.ig)}" target="_blank" rel="noopener">حساب المنصة في الانستا${ico.ig}</a>`
};

function route(){UNS.splice(0).forEach(f=>f());
 const h=location.hash.slice(1)||'home';let html;
 if(h==='grades')html=views.grades();
 else if(h==='articles')html=views.articles();
 else if(h==='contact')html=views.contact();
 else if(h==='book')html=views.book();
 else if(h==='admin')html=views.admin();
 else if(h==='discuss')html=views.discuss();
 else if(ARTS[h])html=views.article(h);
 else if(h==='about-us')html=views.about();
 else if(/^sub-(9|10|11|12)-[12]-\d+(-(ex|sm|bk|ot|c\d+))?$/.test(h)&&SUBJ[+h.split('-')[3]]){const p=h.split('-');html=views.subject(p[1],p[2],+p[3],p[4])}
 else if(/^s-(9|10|11|12)-[12]$/.test(h)){const p=h.split('-');html=views.subjects(p[1],p[2])}
 else html=views.home();
 const go=()=>{app.innerHTML=html;window.lenis?lenis.scrollTo(0,{immediate:true}):scrollTo(0,0);bind();fx();if(h==='discuss')discuss();if(h==='admin')admin()};
 if(window.gsap&&!reduce&&app.children.length){gsap.to(app,{opacity:0,y:14,duration:.22,ease:'power1.in',onComplete:()=>{go();gsap.fromTo(app,{opacity:0,y:20},{opacity:1,y:0,duration:.6,ease:'power3.out'})}})}else go();
}
function bind(){
 document.querySelectorAll('[data-t]').forEach(b=>b.onclick=()=>toast(b.dataset.t));
 document.querySelectorAll('.faq .item').forEach(it=>{const q=it.querySelector('.q'),a=it.querySelector('.a');
  q.onclick=()=>{const o=it.classList.toggle('open');q.setAttribute('aria-expanded',o);q.querySelector('.ic').textContent='+';
   reduce?a.style.height=o?'auto':0:gsap.to(a,{height:o?'auto':0,duration:.35,ease:'power2.out'})}});
 document.querySelectorAll('.grade').forEach(g=>{const s=g.querySelector('.sub');
  g.querySelector('.row').onclick=()=>{const o=g.classList.toggle('open');reduce?s.style.height=o?'auto':0:gsap.to(s,{height:o?'auto':0,duration:.4,ease:'power2.out'})}});
 if(reduce||!window.gsap)document.querySelectorAll('[data-s]').forEach(el=>{el.textContent=STAT[el.dataset.s].toLocaleString('en-US');el.dataset.done=1});
}
function fx(){
 if(!window.gsap||reduce)return;
 if(window.ScrollTrigger)ScrollTrigger.getAll().forEach(t=>t.kill());
 gsap.utils.toArray('.pil,.stat,.art,.grade,.faq .item,.ad,.why,.big-link,.grp,.body').forEach(el=>gsap.from(el,{y:44,opacity:0,duration:.9,ease:'power3.out',scrollTrigger:window.ScrollTrigger?{trigger:el,start:'top 92%',once:true}:undefined}));
 const split=el=>{const t=el.textContent.trim();el.setAttribute('aria-label',t);el.innerHTML=t.split(/\s+/).map(w=>`<span class="w" aria-hidden="true"><span>${w}</span></span>`).join(' ');return el.querySelectorAll('.w>span')};
 gsap.utils.toArray('.hero h1,.hero .s1,.hero .s2,.page-t,h2,.why,.pil h3,.pil p,.stat p').forEach(el=>{const w=split(el);gsap.from(w,{yPercent:115,opacity:0,duration:1,ease:'power3.out',stagger:.07,scrollTrigger:window.ScrollTrigger?{trigger:el,start:'top 92%',once:true}:undefined})});
 if(document.querySelector('.hero .btn'))gsap.from('.hero .btn',{opacity:0,scale:.88,delay:1.1,duration:.9,ease:'back.out(1.7)'});
 document.querySelectorAll('[data-s]').forEach(el=>{const o={v:0};el.textContent='0';
  const run=()=>gsap.to(o,{v:STAT[el.dataset.s],duration:3,ease:'power3.out',onUpdate:()=>el.textContent=Math.round(o.v).toLocaleString('en-US'),onComplete:()=>{el.dataset.done=1;gsap.fromTo(el.parentElement,{scale:1.14},{scale:1,duration:.9,ease:'elastic.out(1,.4)'})}});
  window.ScrollTrigger?ScrollTrigger.create({trigger:el,start:'top 92%',once:true,onEnter:run}):run()});
 gsap.to('.spark',{y:-14,duration:2.8,ease:'sine.inOut',yoyo:true,repeat:-1});
 gsap.to('.spark svg',{rotate:6,duration:3.4,ease:'sine.inOut',yoyo:true,repeat:-1});
 gsap.to('.ad svg',{y:-9,rotate:3,duration:3,ease:'sine.inOut',yoyo:true,repeat:-1});
 gsap.to('.stat svg',{y:-6,duration:2.2,ease:'sine.inOut',yoyo:true,repeat:-1,stagger:.5});
 if(window.ScrollTrigger&&document.querySelector('.pillars'))gsap.fromTo('.pillars',{'--l':0},{'--l':1,scrollTrigger:{trigger:'.pillars',start:'top 80%',end:'bottom 70%',scrub:.6}});
 if(window.ScrollTrigger&&document.querySelector('.hero'))gsap.to('.hero .spark',{yPercent:-30,scale:.8,opacity:.4,scrollTrigger:{trigger:'.hero',start:'top top',end:'bottom top',scrub:true}});
 document.querySelectorAll('.btn.big,.big-link').forEach(b=>{b.onmousemove=e=>{const r=b.getBoundingClientRect();gsap.to(b,{x:(e.clientX-r.left-r.width/2)*.12,y:(e.clientY-r.top-r.height/2)*.18,duration:.4,ease:'power3.out'})};b.onmouseleave=()=>gsap.to(b,{x:0,y:0,duration:.6,ease:'elastic.out(1,.5)'})});
}
const menu=$('#menu');
$('#open').onclick=()=>{menu.classList.add('on');if(window.gsap&&!reduce){gsap.fromTo('#menu .panel',{x:-360},{x:0,duration:.55,ease:'power3.out'});gsap.from('#menu .panel a',{x:-30,opacity:0,stagger:.07,delay:.15,duration:.5,ease:'power3.out'})}};
$('#close').onclick=()=>menu.classList.remove('on');
menu.onclick=e=>{if(e.target===menu||e.target.tagName==='A'){menu.classList.remove('on');if(e.target.dataset.go)setTimeout(()=>{const t=document.getElementById(e.target.dataset.go);t&&t.scrollIntoView({behavior:'smooth'})},80)}};

## 📖 أولاً: القراءة (Reading)
استخدموا تطبيق Read Theory، تختاروا فيه إنكم طلاب أو معلمين وتحددوا مستواكم، وبيظهر لكم قطع قراءة تناسبكم وتطور مهارتكم.
📚 وبرضو في قصص بسيطة بجوجل تابعة لموقع وزارة التربية والتعليم، مفيدة جداً للممارسة اليومية.
## 🎧 ثانياً: الاستماع (Listening)
🎧 عشان يتطور معكم الاستماع، حاولوا تسمعوا بودكاست بشكل يومي.
- للأندرويد: Google Podcasts
- للآيفون: Apple Podcasts
وشوفوا مسلسلات أو أنمي بالإنجليزي بدون ترجمة،
خذوا وقتكم في مكان هادي وقت المذاكرة أو الاستماع، عشان تقدروا تركزوا أكثر.
في البداية طبيعي تحسوا إنكم ما تفهموا كثير، بس مع الاستمرار بتلاحظوا فرق كبير، وبتبدوا تفهموا كلمات وعبارات أكثر كل يوم 💪🏻
## نصائح إضافية للاستماع:
- تابعوا مسلسلات بدون ترجمة حتى لو صعب بالبداية، مع الوقت تتعودوا.
- جربوا موقع Six Minute English⏱️ فيه مقاطع قصيرة ومفيدة جداً للتدريب اليومي.
- استخدموا تطبيق TED 💡 ميزته إنه يعرض شخص يتكلم ومعه النص مكتوب تحت الكلام، فهالطريقة تساعدكم تتعلموا كلمات جديدة وتفهموا نطقها. (ولو التطبيق ما اشتغل، تقدروا تتابعوا قناتهم باليوتيوب بنفس الاسم).
## 🧠 ثالثاً: تثبيت المفردات (Vocabulary)
عشان تثبت الكلمة في ذهنك، ركّز على هالخمس فلاتر
- المعنى
- النطق
- نوع الكلمة (اسم، فعل، صفة...)
- مثال عليها
- المرادفات
📚 استخدموا معاجم مثل: Cambridge, Oxford, أو Longman— من أفضل المصادر لتعلم الكلمات بدقة.
**وأهم شيء: الاستمرار!**
حتى لو بالبداية ما تفهموا كل شيء، مع الممارسة اليومية بتلاحظوا إن لغتكم تتحسن خطوة بخطوة ✨
> 🎯 وهدفنا إننا لما نوصل للاختبار النهائي نكون فاهمين اللغة ولو شوي، ما شرط نكون مثاليين، لكن نكون فاهمين الأساس ومتعوّدين على السمع والقراءة والتحدث💪🏻

## فريق ونَار يقدم
**مواضيع برزننتيشن وعروض شفوية**
يقدّم فريق ونَار مجموعة مختارة من المواضيع الإبداعية والمُلهمة، المناسبة للبرزنتيشن والعروض الشفوية، والمصنّفة بعناية لتناسب اهتمامات الطلاب وتساعدهم على تقديم محتوى قوي، منظم، وجاذب للانتباه.
## 🤖 التكنولوجيا والمستقبل | Tech & Future
+ الذكاء الاصطناعي
هل سيسرق الوظائف أم سيخلق مهناً جديدة؟
نقاش حول تأثير الذكاء الاصطناعي على سوق العمل، والوظائف التي قد تختفي مقابل المهن الجديدة التي ستظهر.
+ الميتافيرس (Metaverse)
هل سنعيش قريباً داخل الإنترنت؟
استعراض لفكرة العوالم الافتراضية وكيف يمكن أن تغيّر طريقة تواصلنا، تعليمنا، وحتى عملنا.
+ السيارات ذاتية القيادة
من المسؤول قانونياً إذا وقع حادث؟
تحليل للتحديات القانونية والأخلاقية المرتبطة بالسيارات الذكية.
+ المدن الذكية
كيف ستبدو مدينة "نيوم" و"ذا لاين" في المستقبل؟
نظرة مستقبلية على المدن المعتمدة على التقنية والاستدامة.
+ تجميد الأجساد
هل يمكن للعلماء إعادة إحياء البشر بعد موتهم في المستقبل؟
موضوع علمي مثير يجمع بين الخيال والبحث العلمي.
## 🧠 علم النفس والسلوك | Psychology & Behavior
+ تأثير الفراشة (Butterfly Effect)
كيف يمكن لقرار صغير جداً أن يغير مجرى حياتك بالكامل؟
+ متلازمة المحتال (Imposter Syndrome)
لماذا يشعر الأذكياء دائماً أنهم لا يستحقون نجاحهم؟
+ سيكولوجية الألوان
لماذا تستخدم مطاعم الوجبات السريعة اللون الأحمر والأصفر دائماً؟
+ إدمان الدوبامين

+ الاحتراق النفسي (Burnout)

## 🌿 الطبيعة والبيئة | Nature & Environment

عند اختيارك لأي من هذه المواضيع، احرص دائماً على أن تبدأ العرض بـ **سؤال صادم أو قصة قصيرة** تشد انتباه الجمهور منذ اللحظة الأولى.
**مثال:**
> "هل تعلمون أنكم تقضون ما يقارب 3 سنوات من حياتكم في الحمّام؟ اليوم سأحدثكم عن كيفية استغلال وقتنا بشكل أفضل…"
**الله يوفقكم لما يحبه ويرضاه**`},

الكثير من الطلاب يواجهون صعوبة في مادة الكيمياء، والسبب غالبًا ليس صعوبة المادة نفسها، بل طريقة المذاكرة الخاطئة. الكيمياء مادة تعتمد على الفهم، الربط، والتطبيق، وليس الحفظ فقط.
في هذا المقال، بنعطيك خطوات عملية لمذاكرة الكيمياء بشكل ذكي وفعّال.
## أولًا: افهم قبل ما تحفظ
أكبر خطأ هو حفظ القوانين بدون فهم.
اسأل نفسك:
- ليش هذا القانون موجود؟
- وش المشكلة اللي يحلها؟
حاول تربط كل قانون بتجربة أو مثال بسيط.
> 📌 مثال: قبل حفظ قوانين المول، افهم أولًا فكرة كمية المادة ولماذا نستخدم المول بدل العد المباشر.
## ثانيًا: الكيمياء = مسائل أكثر من نظري
حتى الأجزاء النظرية تحتاج تطبيق.
بعد كل درس:
- حل 5–10 مسائل على الأقل
- حتى لو كان الدرس شرح فقط
الحل يثبّت الفهم أكثر من القراءة عشر مرات.
## ثالثًا: لا تذاكر الكيمياء بدون ورقة وقلم
الكيمياء مادة تفاعلية.
اكتب:
- المعادلات
- الخطوات
- الملاحظات
لا تكتفي بالقراءة أو المشاهدة فقط.
✍️ كتابة المعادلة بنفسك = نصف الفهم.
## رابعًا: قسّم الدرس إلى أجزاء صغيرة
لا تحاول تذاكر درس كامل دفعة واحدة.
قسمه مثلًا إلى:
- تعريفات
- قوانين
- أمثلة محلولة
- مسائل تدريبية
وذاكر كل جزء لحاله.
## خامسًا: افهم المعادلات بدل حفظها
المعادلات الكيميائية تخوّف كثير من الطلاب، لكن في الحقيقة:
**كل معادلة تحكي قصة تفاعل**
حاول تفهم:
- من المتفاعل؟
- من الناتج؟
- لماذا حصل التفاعل؟
## سادسًا: المراجعة الذكية أهم من المذاكرة الطويلة
راجع الكيمياء بشكل متكرر لكن قصير
- 20–30 دقيقة يوميًا أفضل من 3 ساعات قبل الاختبار
استخدم:
- ملخصات
- أسئلة سريعة
- مسائل متنوعة
## سابعًا: لا تهمل الأخطاء
إذا غلطت في مسألة:
- لا تمسحها وتكمل
- اسأل: ليش غلطت؟
**الخطأ هو أفضل معلم في الكيمياء**
## خلاصة
الكيمياء ما تحتاج ذكاء خارق، تحتاج:
- فهم
- تدريب
- تنظيم
ولو غيرت طريقتك في المذاكرة، بتلاحظ فرق كبير في وقت قصير.

## أفضل قنوات يوتيوب مفيدة لطلاب الصف الثاني عشر
يواجه طلاب الصف الثاني عشر ضغطًا كبيرًا مع كثافة المناهج وقرب الاختبارات، ومع تطور المحتوى التعليمي على يوتيوب أصبح الوصول إلى شرح مبسّط وواضح أسهل من أي وقت مضى. في هذا المقال جمعنا لكم مجموعة قنوات تعليمية موثوقة ومفيدة، تغطي معظم مواد منهج الصف الثاني عشر، بأسلوب سهل ومباشر.
## 📘 الرياضيات
قنوات تركز على تبسيط القوانين، حل الأسئلة الوزارية، وشرح الأفكار خطوة بخطوة:
- Easy Math
- أ. إيهاب السيد
- أ. سلطان الشيدي
## ⚡ الفيزياء
شروحات واضحة مع أمثلة عملية وتدريبات على مسائل الاختبارات:
- أ. مستر فيزيائي
- أ. حمود المبسلي
- واحة الفيزياء
## 🧪 الكيمياء
شرح مبسط للتفاعلات، القوانين، والحفظ بطريقة ذكية:
- MENASSA
- أ. هشام المحاربي | بروتون الكيمياء
## 🧬 الأحياء
قنوات تهتم بالشرح المفاهيمي والرسومات التوضيحية:
- أ. مصطفى م ع شاكر
- أ. عمر الزدجالي
## 📖 اللغة العربية
شرح القواعد، البلاغة، النصوص، والتعبير بطريقة منظمة:
- أ. يعقوب مؤلف النرجس
- أ. أحمد المزروعي
## 🕌 التربية الإسلامية
تبسيط الدروس مع ربطها بالحياة اليومية:
- أ. حازم عثمان
## 🌍 اللغة الإنجليزية
قنوات تساعد في القواعد، المفردات، والفهم:
- أ. خميس الغافري
## 📚 جميع المناهج
قنوات شاملة تغطي أكثر من مادة وتفيد في المراجعة العامة:
- عمان التعليم
- دار القرآن
## 🎯 خلاصة
هذه القنوات تعتبر أدوات مساعدة قوية لطلاب الصف الثاني عشر، لكنها لا تغني عن الكتاب المدرسي، بل تكمله وتسهّل فهمه. ننصح بتنظيم وقت المشاهدة، والتركيز على الدروس التي تحتاج إلى تقوية.

async function driveKids(id,key){const out=[];let tok='';try{do{const r=await fetch('https://www.googleapis.com/drive/v3/files?q='+encodeURIComponent(`'${id}' in parents and trashed=false`)+'&fields=nextPageToken,files(id,name,mimeType)&pageSize=200&orderBy=name&supportsAllDrives=true&includeItemsFromAllDrives=true&key='+encodeURIComponent(key)+(tok?'&pageToken='+tok:''));if(!r.ok)break;const j=await r.json();out.push(...(j.files||[]));tok=j.nextPageToken||''}while(tok)}catch(e){}return out}

 const done=async(err,msg)=>{if(err){toast('تعذّر التنفيذ');return}EDIT=null;await pullFiles();tFil();if(msg)toast(msg)};
 if(d.tab){AT=d.tab;EDIT=null;draw();return}
 if(d.g){AG=AG==+d.g?null:+d.g;AT2=null;AS_=null;EDIT=null;tFil();return}
 if(d.term){AT2=+d.term;AS_=null;EDIT=null;tFil();return}
 if(d.sub!==undefined){AS_=+d.sub;EDIT=null;tFil();return}
 if(d.imp){importBase();return}
 if(d.ed){EDIT=+d.ed;tFil();return}
 if(d.cn){EDIT=null;tFil();return}
 if(d.sv){const r=b.closest('.file'),v=k=>r.querySelector('[data-e="'+k+'"]').value.trim(),row=EXTRA.find(x=>x._k==d.sv),lk=v('l')?parseLk(v('l')):{fid:row.fid,ty:row.ty};
  if(!lk){toast('رابط غير صالح');return}if(!v('n')){toast('اكتب الاسم');return}
  const p=place(v('s'),v('n'));const{error}=await sb.from('files').update({name:p.name,fid:lk.fid,ty:lk.ty,section:p.section}).eq('id',d.sv);return done(error,'تم الحفظ')}
 if(d.del){if(!confirm('حذف هذا الملف؟'))return;const{error}=await sb.from('files').delete().eq('id',d.del);return done(error,'تم الحذف')}
 if(d.rn!==undefined){const old=SECN[+d.rn],nn=(prompt('الاسم الجديد للقسم',old)||'').trim();if(!nn||nn==old)return;const{error}=await sb.from('files').update({section:nn}).match({...sf(),section:old});return done(error,'تمت إعادة التسمية')}
 if(d.ds!==undefined){const old=SECN[+d.ds];if(!confirm('حذف القسم «'+old+'» وكل ملفاته؟'))return;const{error}=await sb.from('files').delete().match({...sf(),section:old});return done(error,'تم حذف القسم')}
 if(d.ns){const n=(prompt('اسم القسم الجديد')||'').trim();if(n){addOpt($('#af-s'),n);toast('الصق الروابط واضغط تحليل، وسيُنشأ القسم مع أول ملف')}return}
 if(d.an){const raw=$('#af-l').value,key=$('#af-k').value.trim(),ex=$('#af-x').checked,all=$('#af-s').value;try{if(key)localStorage.setItem('wn_gk',key)}catch(e){}
  const items=parseSmart(raw);if(!items.length){toast('الصق رابط درايف واحداً على الأقل');return}
  b.disabled=true;toast('جارٍ التحليل…');PV=[];
  for(const it of items){let info=null;if(key&&!it.nm)info=await driveInfo(it.fid,key);
   if(it.ty!='d'&&info&&info.mimeType=='application/vnd.google-apps.folder')it.ty='d';
   if(it.ty=='d'&&ex&&key){const kids=await driveKids(it.fid,key);if(kids.length){kids.forEach(k=>PV.push({nm:cleanN(k.name),fid:k.id,ty:k.mimeType=='application/vnd.google-apps.folder'?'d':'f'}));continue}}
   PV.push({nm:it.nm||(info&&info.name?cleanN(info.name):''),fid:it.fid,ty:it.ty})}
  b.disabled=false;PV.forEach((r,k)=>{if(!r.nm)r.nm='ملف '+(k+1);r.sec=all&&all!='__new'?all:guessSec(r.nm)});renderPV();return}
 if(d.px!==undefined){syncPV();PV.splice(+d.px,1);renderPV();return}
 if(d.pc){PV=[];renderPV();return}
 if(d.fa){syncPV();if(!PV.length)return;b.disabled=true;
  const out=PV.map(r=>{const nm=(r.nm||'').trim()||'ملف',p=place(r.sec||'ملفات أخرى',nm,gType(nm));return{...sf(),name:p.name,fid:r.fid,ty:r.ty,section:p.section}});
  let error=null;for(let k=0;k<out.length&&!error;k+=200)error=(await sb.from('files').insert(out.slice(k,k+200))).error;
  b.disabled=false;if(!error){PV=[];$('#af-l').value=''}return done(error,`أُضيف ${out.length} ملف ✓`)}
 if(d.bm){const sec=$('#bm').value;if(!sec||sec=='__new'){toast('اختر القسم أولاً');return}const rows=EXTRA.filter(x=>SEL.has(x._k));const res=await Promise.all(rows.map(r=>sb.from('files').update(mv(r,sec)).eq('id',r._k)));SEL.clear();return done(res.some(x=>x.error)?1:0,'تم النقل ✓')}
 if(d.bd){if(!confirm('حذف '+SEL.size+' ملف؟'))return;const{error}=await sb.from('files').delete().in('id',[...SEL]);SEL.clear();return done(error,'تم الحذف')}
 if(d.bc){SEL.clear();tFil();return}
 if(d.qg){AQG=+d.qg;tDis();return}
 if(d.qa){const t=$('#qt').value.trim();if(!t)return;const{error}=await sb.from('questions').insert({grade:AQG,text:t});if(error)toast('تعذّر النشر');else tDis();return}
 if(d.qd){if(!confirm('حذف السؤال وكل ردوده؟'))return;const{error}=await sb.from('questions').delete().eq('id',d.qd);if(error)toast('تعذّر الحذف');else tDis();return}
 if(d.ad){const{error}=await sb.from('answers').delete().eq('id',d.ad);if(error)toast('تعذّر الحذف');else tDis()}}
async function admin(){const box=$('#adm');
 if(!sb){box.innerHTML='<div class="body"><p>لوحة التحكم تحتاج اتصال قاعدة البيانات.</p></div>';return}
 if(!ME){box.innerHTML='<div class="body"><p>سجّل دخولك بحساب المشرف أولاً.</p><button class="btn" id="al">تسجيل الدخول</button></div>';$('#al').onclick=askLogin;return}
 if(!ADMIN){box.innerHTML='<div class="body"><p>هذه الصفحة للمشرف فقط.</p></div>';return}
 box.innerHTML=`<div class="chips" id="tabs">${TABS.map(t=>`<button class="chip" data-tab="${t[0]}">${t[1]}</button>`).join('')}</div><div id="tab"></div>`;
 box.onclick=adminClick;box.onchange=adminChange;box.onkeydown=e=>{if(e.key=='Enter'&&e.target.matches('input.nm'))e.target.blur()};draw()}

if('serviceWorker' in navigator)addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
initDB();

if(window.gsap&&window.ScrollTrigger)gsap.registerPlugin(ScrollTrigger);
addEventListener('hashchange',route);route();
if(window.Lenis&&!reduce){const l=window.lenis=new Lenis({lerp:.08,smoothWheel:true});
 l.on('scroll',()=>{window.ScrollTrigger&&ScrollTrigger.update();const m=document.documentElement.scrollHeight-innerHeight;$('.prog').style.transform='scaleX('+(m>0?Math.min(1,scrollY/m):0)+')'});
 gsap.ticker.add(t=>l.raf(t*1000));gsap.ticker.lagSmoothing(0)}
else addEventListener('scroll',()=>{const m=document.documentElement.scrollHeight-innerHeight;$('.prog').style.transform='scaleX('+(m>0?Math.min(1,scrollY/m):0)+')'});
</script>
</body>
